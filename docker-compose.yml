version: '3.8'

services:
  api:
    build: ./backend
    container_name: raccon_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend/raccoon
    container_name: raccon_frontend
    ports:
      - "3000:8080"
    env_file:
      - ./frontend/raccoon/.env
    environment:
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./frontend/raccoon:/app
      - /app/node_modules
    restart: always