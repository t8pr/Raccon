<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>{{ title }}</title>
  <style>
    html { color-scheme: light only; }
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    @media only screen and (max-width: 600px) {
      .wrapper { padding: 0 !important; }
      .header, .footer { border-radius: 0 !important; padding: 22px 20px !important; }
      .card { padding: 32px 20px 24px !important; }
      .title { font-size: 26px !important; }
      .button { display: block !important; }
    }
  </style>
</head>
<body dir="rtl" style="margin:0;padding:0;background:#EEECF7;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">
    {{ preheader }}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EEECF7">
    <tr>
      <td align="center" class="wrapper" style="padding:32px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"
               dir="rtl" style="width:100%;max-width:560px;font-family:'Noto Naskh Arabic','Geeza Pro','Segoe UI',Tahoma,Arial,sans-serif;">
          <tr>
            <td class="header" bgcolor="#0E0C22" style="padding:28px 32px;border-radius:24px 24px 0 0;">
              <table role="presentation" dir="rtl" cellpadding="0" cellspacing="0" border="0" align="right">
                <tr>
                  <td style="padding-left:12px;">
                    <img src="{{ logo_url }}" alt="" width="40" height="40" style="display:block;border:0;">
                  </td>
                  <td dir="ltr" style="color:#C5EEDC;font-family:Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;">
                    راكون
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="card" bgcolor="#FFFFFF" dir="rtl" style="padding:40px 32px 32px;text-align:right;">
              <h1 class="title" style="margin:0 0 16px;color:#352A87;font-size:30px;line-height:1.5;">{{ title }}</h1>
              <p style="margin:0 0 24px;color:#1B1736;font-size:17px;line-height:1.9;">{{ body }}</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#4535A8" style="border-radius:14px;">
                    <a class="button" href="{{ link }}"
                       style="display:inline-block;padding:14px 32px;color:#FFFFFF;font-size:17px;font-weight:700;text-decoration:none;">
                      {{ button_label }}
                    </a>
                  </td>
                </tr>
              </table>

              {% if is_reset %}
              <p style="margin:24px 0 16px;padding:14px 18px;background:#E8F8F0;border-radius:14px;color:#1B1736;font-size:15px;line-height:1.8;">
                ينتهي هذا الرابط خلال ١٥ دقيقة.
              </p>
              <p style="margin:0 0 6px;color:#5D5878;font-size:14px;line-height:1.9;">
                إذا لم يعمل الزر، انسخ هذا الرابط والصقه في المتصفح:
              </p>
              <p dir="ltr" style="margin:0 0 16px;text-align:left;word-break:break-all;color:#4535A8;font-size:13px;line-height:1.5;">
                {{ link }}
              </p>
              {% endif %}

              <p style="margin:{% if is_reset %}0{% else %}24px 0 0{% endif %};color:#5D5878;font-size:14px;line-height:1.9;">
                {{ notice }}
              </p>
            </td>
          </tr>
          <tr>
            <td bgcolor="#C5EEDC" height="14" style="height:14px;line-height:14px;font-size:0;">&nbsp;</td>
          </tr>
          <tr>
            <td class="footer" bgcolor="#0E0C22" dir="rtl" style="padding:24px 32px 28px;border-radius:0 0 24px 24px;text-align:right;">
              <p style="margin:0;color:#C5EEDC;font-size:16px;font-weight:700;">كل قطعة تخبّي حكاية</p>
              <p style="margin:4px 0 0;color:#9A96B8;font-size:12px;line-height:1.8;">
                وصلتك هذه الرسالة بسبب نشاط على حسابك في راكون.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
