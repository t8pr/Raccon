name: Notify Raccon Team on Merge to Dev

on:
  pull_request:
    types: [closed]
    branches:
      - Dev

jobs:
  notify-discord:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Alert
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": "@everyone Heads-up team!",
              "embeds": [{
                "title": "Merged to `dev`",
                "description": "**${{ github.event.pull_request.title }}**",
                "color": 5763719,
                "fields": [
                  {"name": "Author", "value": "${{ github.event.pull_request.user.login }}", "inline": true},
                  {"name": "From Branch", "value": "`${{ github.event.pull_request.head.ref }}`", "inline": true},
                  {"name": "To Branch", "value": "`dev`", "inline": true}
                ],
                "url": "${{ github.event.pull_request.html_url }}"
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
