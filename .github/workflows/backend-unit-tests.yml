name: Backend unit tests

on:
  pull_request:
    branches:
      - Dev
      - main

permissions:
  contents: read

concurrency:
  group: backend-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://test:test@localhost:5432/raccon_test
      SECRET_KEY: ci-only-secret-key
      RESEND_API_KEY: ci-dummydata
      MAX_EDIT_LIMIT: "3"
      REDIS_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run service unit tests
        run: >-
          python -m pytest
          tests/test_auth_service.py
          tests/test_pack_service.py
          tests/test_journey_service.py
          tests/test_event_service.py
          -v
