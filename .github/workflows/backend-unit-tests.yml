name: Backend tests

on:
  pull_request:
    branches:
      - Dev
      - main

permissions:
  contents: read
  checks: write

concurrency:
  group: backend-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://test:test@localhost:5432/raccon_test
      SECRET_KEY: ci-only-secret-key
      RESEND_API_KEY: ci-dummydata
      MAX_EDIT_LIMIT: "3"
      REDIS_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache installed test dependencies
        id: test-venv
        uses: actions/cache@v4
        with:
          path: backend/.venv-ci
          key: backend-venv-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Set up uv for cold installs
        if: steps.test-venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install dependencies
        if: steps.test-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-ci
          uv pip install --python .venv-ci/bin/python -r requirements.txt

      - name: Run unit and route integration tests
        run: .venv-ci/bin/python -m pytest tests -v --junitxml=test-results/backend-tests.xml

      - name: Publish backend test results
        if: ${{ !cancelled() && hashFiles('backend/test-results/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/test-results/*.xml
          check_name: Backend test results
          comment_mode: "off"
          compare_to_earlier_commit: "false"
          check_run: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          job_summary: "true"
          test_file_prefix: +backend/

      - name: Upload JUnit XML report
        if: ${{ !cancelled() && hashFiles('backend/test-results/*.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/*.xml
          retention-days: 14
